name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install -r requirements.txt
          npm ci
          bundle exec jekyll build
          npx --yes purgecss@7 -c purgecss.config.js
          bundle exec ruby scripts/validate_built_site.rb
      - name: Run Lighthouse
        run: |
          npx --yes @lhci/cli@0.15.x collect
          npx --yes @lhci/cli@0.15.x assert
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
