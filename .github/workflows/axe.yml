name: Axe accessibility testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    # Keep Ruby 3.3.5 on a runner with a matching prebuilt binary.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install -r requirements.txt
          npm ci
          bundle exec jekyll build
          npx --yes purgecss@7 -c purgecss.config.js
      - name: Run Axe on public pages
        run: npx playwright test --config test/accessibility/playwright.config.js
