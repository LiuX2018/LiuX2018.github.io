name: Check internal links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and validate
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install -r requirements.txt
          npm ci
          ruby scripts/check_publication_previews.rb
          bundle exec jekyll build
          npx --yes purgecss@7 -c purgecss.config.js
          bundle exec ruby scripts/validate_built_site.rb
      - name: Check generated links
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          lycheeVersion: v0.24.2
          args: --offline --root-dir _site --verbose --no-progress '_site/**/*.html'
