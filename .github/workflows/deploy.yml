name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system, Python, and Node dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install -r requirements.txt
          npm ci

      - name: Refresh GitHub repository snapshots
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bundle exec ruby scripts/refresh_repositories.rb

      - name: Audit migration contracts
        run: |
          bundle exec al-folio upgrade audit
          bundle exec al-folio upgrade overrides audit --fail-on-stale
          ruby scripts/check_publication_previews.rb
          bundle exec ruby test/refresh_repositories_test.rb
          npm run lint:prettier
          npm run lint:style-contract

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build
          npx --yes purgecss@7 -c purgecss.config.js
          bundle exec ruby scripts/validate_built_site.rb

      - name: Upload built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: _site/
          retention-days: 14

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
